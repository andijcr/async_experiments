name: devenv image

# Refreshes the ":latest" tag of the dev/CI container (docker/Dockerfile)
# in GHCR for local development convenience, once it's landed on main.
#
# ci.yml does NOT depend on this workflow — it builds and loads its own
# image locally on every run (see ci.yml's own header comment), so a PR
# that changes docker/Dockerfile is still gated against its own changes.

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - ".github/workflows/devenv-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/async-experiments-devenv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
