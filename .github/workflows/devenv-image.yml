name: devenv image

# Refreshes the ":latest" tag of the dev/CI container (docker/Dockerfile)
# in GHCR for local development convenience, once it's landed on main.
#
# ci.yml is self-sufficient and does NOT depend on this workflow — it
# builds and pushes its own commit-SHA-tagged image every run (with layer
# caching, so it's cheap once the Dockerfile is unchanged). A workflow
# that only builds on push-to-main can never produce an image for the PR
# that first introduces the Dockerfile (chicken-and-egg), which is exactly
# what broke PR #1's CI — see docs/PLAN.md, "Docker strategy".

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - ".github/workflows/devenv-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/async-experiments-devenv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
