name: ci

# Gates PRs: clang-format, clang-tidy, build, and unit tests, all run
# inside the pinned devenv image (docker/Dockerfile) so CI and local dev
# share exactly the same toolchain. See docs/PLAN.md.
#
# build-image always (re)builds and pushes that image first, tagged by
# commit SHA, and gate depends on it and pulls that exact tag. This avoids
# a bootstrap problem: a separate "only builds on push to main" image
# workflow can never produce an image for the PR that first introduces it
# (main doesn't have the Dockerfile yet, and workflow_dispatch requires
# the workflow file to already exist on the default branch). With Docker
# layer caching (cache-from/to: gha) this costs a few seconds once the
# Dockerfile itself hasn't changed, not a full LLVM reinstall per run.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/async-experiments-devenv

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/async-experiments-devenv:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: clang-format check
        run: |
          find est examples -type f \( -name "*.cpp" -o -name "*.cppm" -o -name "*.h" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: configure
        run: cmake --preset ci

      - name: clang-tidy check
        run: |
          find est examples -type f \( -name "*.cpp" -o -name "*.cppm" \) \
            -print0 | xargs -0 -n1 clang-tidy -p build/ci

      - name: build
        run: cmake --build --preset ci

      - name: test
        run: ctest --preset ci
