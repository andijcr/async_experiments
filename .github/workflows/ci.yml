name: ci

# Gates PRs: clang-format, clang-tidy, build, and unit tests, all run
# inside the pinned devenv image (docker/Dockerfile) so CI and local dev
# share exactly the same toolchain.
#
# The devenv image is built and `load`ed into the runner's local Docker
# daemon (not pushed to a registry) and driven with plain `docker run`,
# rather than the job-level `container:` directive pulling a pre-pushed
# image. `container:` needs an image already sitting in a registry, which
# needs push (packages: write) permission - and a pull_request run
# triggered from a fork always gets a read-only GITHUB_TOKEN, so a
# push-based design would silently break CI for external contributors.
# Building locally with layer caching (cache-from/to: gha) is just as
# cheap once the Dockerfile is unchanged.
#
# clang-tidy runs AFTER the build, not before: analyzing a TU that
# `import`s a module needs that module's already-compiled BMI, which only
# exists once `cmake --build` has produced it.
#
# Each `docker run` below runs as the runner's own UID:GID (not the
# image's baked-in `est` user, UID 1000) so files written into the
# bind-mounted workspace are never owned by a UID the runner can't touch,
# whatever UID actions/checkout happens to run as. HOME=/tmp avoids tools
# choking on a UID with no passwd entry / home directory in the image.
#
# The coverage step gates on *new-code* (diff/patch) coverage, not
# overall repository coverage: the "ci" preset itself builds with
# Clang's source-based coverage instrumentation
# (-fprofile-instr-generate -fcoverage-mapping), so the build+test above
# already produces .profraw alongside the format/tidy-gated binaries. The
# profraw is exported to lcov via llvm-cov, then intersected with the
# PR's diff via diff-cover so only the lines a PR actually touches are
# held to the threshold. Needs full git history (fetch-depth: 0) for
# diff-cover to compute the diff against origin/main.
#
# The final two steps are a second, separate configure+build+test pass
# using the "sanitize" preset (-fsanitize=address,undefined on est and
# est_tests; examples excluded - see cmake/Sanitizers.cmake). This can't
# reuse the "ci" preset's own build: coverage instrumentation and
# sanitizer instrumentation are different compile/link flags on the same
# targets, so they need separate build directories (build/sanitize, via
# the preset's own binaryDir, not build/ci).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVENV_IMAGE: est-devenv:ci

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: build devenv image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.DEVENV_IMAGE }}
          cache-from: type=gha
          # mode=min (not max): the Dockerfile is single-stage, so there is
          # no intermediate build stage for mode=max to additionally cache -
          # it would just export the same final-image layers with more
          # overhead.
          cache-to: type=gha,mode=min

      - name: clang-format check
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          bash -c 'find est estwasm examples -type f \( -name "*.cpp" -o -name "*.cppm" -o -name "*.h" \) -print0 | xargs -0 clang-format --dry-run --Werror'

      - name: configure
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          cmake --preset ci

      - name: build
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          cmake --build --preset ci

      # estwasm/estpico aren't included here (unlike the clang-format check
      # above), and examples/multicolor_larson_scanner/web and .../mps2an385
      # are explicitly pruned: all are only ever compiled under their own
      # cross-toolchain (the "wasm"/"mps2an385" jobs below), which each
      # produce their own, separate compile_commands.json that
      # clang-tidy -p build/ci can't use - the hosted build's own database
      # has no entry for them at all (a bare `find est examples` would
      # otherwise reach wasm_exports.cpp/main.cpp, since they're nested
      # under examples/, and fail hard on `import estwasm`/`import estpico`
      # never resolving). Left as a known, documented gap (docs/PLAN.md's
      # "Issue #99"/"Issue #123" entries) rather than papering over it with
      # a synthetic host-compiled stand-in target.
      - name: clang-tidy check
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          bash -c 'find est examples \( -path "*/multicolor_larson_scanner/web" -o -path "*/multicolor_larson_scanner/mps2an385" \) -prune -o -type f \( -name "*.cpp" -o -name "*.cppm" \) -print0 | xargs -0 -n1 clang-tidy -p build/ci'

      - name: test
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          ctest --preset ci

      - name: new-code coverage gate
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          bash -c '
            llvm-profdata merge -sparse build/ci/profraw/*.profraw -o build/ci/coverage.profdata &&
            llvm-cov export --format=lcov --instr-profile=build/ci/coverage.profdata build/ci/est/tests/est_tests --object=build/ci/est/tests/est_tests > build/ci/coverage.lcov &&
            diff-cover build/ci/coverage.lcov --compare-branch=origin/main --fail-under=80
          '

      - name: configure (sanitizers)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          cmake --preset sanitize

      - name: build (sanitizers)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          cmake --build --preset sanitize

      - name: test (sanitizers)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace
          ${{ env.DEVENV_IMAGE }}
          ctest --preset sanitize

  # Independent of "gate" above: examples/multicolor_larson_scanner/web is
  # its own, fully separate CMake project (cmake/toolchain-wasm32.cmake's
  # own top comment) targeting wasm32-wasip1-threads instead of this repo's
  # one hosted-Linux toolchain, so it gets its own job rather than folding
  # into "gate"'s existing configure/build/test steps. See docs/PLAN.md's
  # "Issue #99" entry for the full design.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build devenv image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.DEVENV_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: configure (wasm32)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace/examples/multicolor_larson_scanner/web
          ${{ env.DEVENV_IMAGE }}
          cmake --preset wasm32

      - name: build (wasm32)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace/examples/multicolor_larson_scanner/web
          ${{ env.DEVENV_IMAGE }}
          cmake --build --preset wasm32

      # Node, not the devenv image, for the smoke test below: this repo's
      # pinned Clang/CMake toolchain has no reason to also carry a Node
      # install, and the smoke test's whole point is exercising the
      # browser-shaped Worker/main-thread/SharedArrayBuffer design with a
      # real, independent WebAssembly runtime - see
      # examples/multicolor_larson_scanner/web/tests/smoke_test.mjs's own
      # top comment.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: wasm smoke test (import-section check + two-instantiation Worker/main-thread run)
        run: >
          node examples/multicolor_larson_scanner/web/tests/smoke_test.mjs
          examples/multicolor_larson_scanner/web/build/wasm32/larson_scanner_wasm

  # Independent of "gate"/"wasm" above, same shape as "wasm": a fully
  # separate CMake project (cmake/toolchain-mps2an385.cmake's own top
  # comment) targeting armv7m-none-eabi. Unlike "wasm", this still uses
  # the devenv image's own Clang as the actual compiler (not a
  # third-party bundled one - that file's own comment has the full
  # story) - what's genuinely separate here is the sysroot
  # (docker/Dockerfile's /opt/arm-none-eabi-sysroot block) and the
  # runner-native qemu-system-arm this job needs to actually execute the
  # resulting ARM binaries, neither of which "gate" has any reason to
  # carry. See issue #123 for the full investigation.
  mps2an385:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build devenv image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.DEVENV_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: configure (mps2an385)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace/examples/multicolor_larson_scanner/mps2an385
          ${{ env.DEVENV_IMAGE }}
          cmake --preset mps2an385

      - name: build (mps2an385)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v ${{ github.workspace }}:/workspace -w /workspace/examples/multicolor_larson_scanner/mps2an385
          ${{ env.DEVENV_IMAGE }}
          cmake --build --preset mps2an385

      # qemu-system-arm, not the devenv image, for the same reason Node
      # isn't in it for "wasm"'s own smoke test: this repo's pinned
      # toolchain has no reason to also carry a full-system ARM emulator,
      # and running the actual firmware under it is what turns a
      # successful cross-compile into a real correctness signal.
      - name: install qemu-system-arm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: est test suite under QEMU (mps2-an385)
        run: >
          examples/multicolor_larson_scanner/mps2an385/run_under_qemu.sh
          examples/multicolor_larson_scanner/mps2an385/build/mps2an385/tests/est_mps2an385_tests

      - name: larson_scanner smoke test under QEMU (mps2-an385)
        run: >
          examples/multicolor_larson_scanner/mps2an385/run_under_qemu.sh
          examples/multicolor_larson_scanner/mps2an385/build/mps2an385/larson_scanner_mps2an385
