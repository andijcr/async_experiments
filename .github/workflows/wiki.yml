name: wiki

# Mirrors docs/wiki/*.md, plus docs/PLAN.md (as a "Journal" page), into
# this repo's GitHub wiki (its own separate git repo, <repo>.wiki.git) on
# every push to main that touches either - the wiki stays a read-only
# mirror of what's already reviewed and merged in-tree, not a second,
# independently-editable copy that can drift from it (see CLAUDE.md's
# "docs/wiki/ must stay in sync with the code" rule, and PLAN.md's own
# "decision log ... kept scrupulously up to date" - this keeps both true
# on the wiki side too). Additive/overwrite only: copies over the wiki
# repo's same-named pages, never deletes a wiki page this sync doesn't
# own (so a page created directly on the wiki, outside this sync,
# survives).
#
# Needs GitHub wiki enabled for this repository (Settings -> Features ->
# Wikis), AND at least one page saved once through the wiki's own web
# editor (https://github.com/<repo>/wiki) - GitHub only provisions a
# wiki's underlying git repo lazily, the first time a page is saved that
# way, and *nothing* pushed via git (this workflow included) can bootstrap
# that from scratch: `git push` to a wiki with zero pages fails the same
# "Repository not found" way `git clone` does. workflow_dispatch lets
# this run on demand (e.g. right after that one-time manual step, without
# waiting for the next docs/wiki/ or docs/PLAN.md change) - it does not
# remove the need for that step itself.

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "docs/PLAN.md"
      - ".github/workflows/wiki.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout can't be pointed at <repo>.wiki directly when
      # the wiki has never had a page saved (GitHub only creates its git
      # repo lazily, on the first page) - a plain `git clone` falls back
      # to initializing one locally instead of failing the whole job here.
      # This only gets the *local* half working, though - see this file's
      # own top comment: the later push step still needs that one-time
      # manual page save to have happened, and fails with a clear message
      # (not a bare git error) if it hasn't.
      - name: checkout or initialize the wiki repo
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki || {
            echo "wiki repo has no pages yet - initializing locally"
            mkdir wiki
            git -C wiki init -b master
            git -C wiki remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          }

      - name: copy pages from docs/wiki/, plus docs/PLAN.md as Journal.md
        run: |
          cp docs/wiki/*.md wiki/
          cp docs/PLAN.md wiki/Journal.md

      - name: commit and push if anything changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "wiki already up to date"
            exit 0
          fi
          git commit -m "Sync wiki from docs/wiki/ @ ${GITHUB_SHA::7}"
          if ! git push origin HEAD:master; then
            echo "::error::Push to the wiki repo failed. If this is the very first sync, GitHub only creates a wiki's underlying git repo once a page has been saved through its own web editor - visit https://github.com/${{ github.repository }}/wiki, save any placeholder page once, then re-run this workflow (Actions -> wiki -> Run workflow)."
            exit 1
          fi
